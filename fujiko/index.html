<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1a" />
  <title>峰不二子 · 巴黎雨夜 | The Woman on the Roof</title>
  <meta name="description" content="A rainy-night heist in Paris — a toon-shaded 1:64 miniature diorama made with three.js. Fan art tribute to Fujiko Mine." />
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <header id="title">
      <div class="t1">峰不二子 <em>·</em> 巴黎雨夜</div>
      <div class="t2">THE WOMAN ON THE ROOF — PARIS · 1 : 64</div>
    </header>

    <div id="hint">拖动旋转 · 滚轮/双指缩放 · 点点场景里的人、车和猫头鹰</div>

    <nav id="bar">
      <button data-act="rain" class="on" title="雨">
        <svg viewBox="0 0 24 24"><path d="M7 15a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 8 3.5 3.5 0 0 1 18 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>
        <span>下雨</span>
      </button>
      <button data-act="alarm" title="警报">
        <svg viewBox="0 0 24 24"><path d="M6 18v-5a6 6 0 0 1 12 0v5"/><path d="M4 18h16v3H4z"/><path d="M12 2v2M3.5 5.5l1.5 1.5M20.5 5.5L19 7"/></svg>
        <span>警报</span>
      </button>
      <button data-act="orbit" title="自动环绕">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4.5"/><path d="M19 9.5l2 2.6-3 .6"/><circle cx="12" cy="12" r="1.6"/></svg>
        <span>环绕</span>
      </button>
      <button data-act="view" title="切换视角">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span id="viewLabel">视角</span>
      </button>
      <button data-act="style" title="2012《峰不二子という女》风格：排线 + 胶片颗粒">
        <svg viewBox="0 0 24 24"><path d="M14 3l7 7-9 9H5v-7z"/><path d="M5 19l5-5"/><circle cx="11" cy="13" r="1.5"/></svg>
        <span>2012 画风</span>
      </button>
      <button data-act="sound" title="声音（合成音效）">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6"/></svg>
        <span>声音</span>
      </button>
    </nav>

    <div id="bubbles"></div>
    <div id="toast"></div>
  </div>

  <div id="loading">
    <div class="diamond"></div>
    <div class="ltxt">Paris, 23:47 · 雨</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
